<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Add this inside your <head> -->
<meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Register - Agasaro Ballet</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <header>
    <h1>Agasaro Ballet Registration</h1>
    <nav>
      <a href="index.html">Ahabanza</a>
      <a href="about.html">Ibisobanuro</a>
      <a href="requirements.html">Ibisabwa</a>
      <a href="register.html" class="active">Iyandikishe</a>
    </nav>
  </header>

  <section class="register">
    <form id="registerForm">
      <label for="childName">Amazina y'umwana:</label>
      <input type="text" id="childName" name="childName" required>

      <label>Igitsina:</label>
      <div class="radio-group">
        <label><input type="radio" name="childSex" value="Male" required> Gabo</label>
        <label><input type="radio" name="childSex" value="Female" required> Gore</label>
      </div>

      <label for="childAge">Imyaka (Hagati ya 5 na 15 y'amavuko):</label>
      <input type="number" id="childAge" name="childAge" min="5" max="15" required>

      <label for="parentName">Amazina y'umurera:</label>
      <input type="text" id="parentName" name="parentName" required>

      <label for="parentTel">Nimero ya telefone y'umurera:</label>
      <input type="tel" id="parentTel" name="parentTel" pattern="[0-9]{10}" required>

      <button type="submit">Iyandikishe</button>
    </form>
  </section>

  <!-- Confirmation Modal -->
  <div id="confirmationModal" class="modal">
    <div class="modal-content">
      <h2>Kwiyandikisha byagenze neza ✅</h2>
      <p>Kwiyandikisha kwanyu byabitswe. Mukande aho hasi mukomereze kuri whatsapp kugira ngo muhabwe nimero yo kwishyuriraho</p>
      <button id="continueBtn">Mukomereze kuri Whatsapp</button>
      <button id="cancelBtn">Oya</button>
    </div>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(e){
      e.preventDefault();

      const childName = e.target.childName.value;
      const childSex = e.target.childSex.value;
      const childAge = e.target.childAge.value;
      const parentName = e.target.parentName.value;
      const parentTel = e.target.parentTel.value;

      // Send data to Google Apps Script Web App
      fetch("https://script.google.com/macros/s/AKfycbwWqlkyoa10Z7jiGoYFnCkm4CiFj4h2g8BV6lQe2pEa_7vDSsi4yc-9fc565ryIvb0/exec", {
        method: "POST",
        body: JSON.stringify({ childName, childSex, childAge, parentName, parentTel })
      })
      .then(res => res.text())
      .then(data => {
        document.getElementById("confirmationModal").style.display = "block";

        document.getElementById("continueBtn").onclick = function(){
          const whatsappNumber = "+250784015547";
          const message = `Twamaze kwiyandikisha: Umwana ${childName}, Umubyeyi ${parentName}, Nimero ${parentTel}. Muduhe nimero twishyure amafaranga yo kwiyandikisha.`;
          const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
          window.location.href = whatsappURL;
        };

        document.getElementById("cancelBtn").onclick = function(){
          document.getElementById("confirmationModal").style.display = "none";
        };
      })
      .catch(err => alert("❌ Error saving registration: " + err));
    });
  </script>
</body>
</html>
